<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Bill Splitter</title>
    <style>
        :root {
            --primary: #4361ee;
            --primary-light: #4895ef;
            --secondary: #3f37c9;
            --success: #4cc9f0;
            --danger: #f72585;
            --warning: #f8961e;
            --light: #f8f9fa;
            --dark: #212529;
            --gray: #6c757d;
            --border: #e9ecef;
            --shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            --radius: 12px;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: var(--dark);
            line-height: 1.6;
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            overflow: hidden;
        }
        
        .header {
            background: var(--primary);
            color: white;
            padding: 30px;
            text-align: center;
        }
        
        .header h1 {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 10px;
        }
        
        .header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }
        
        .content {
            padding: 30px;
        }
        
        .section {
            margin-bottom: 40px;
            padding: 25px;
            background: var(--light);
            border-radius: var(--radius);
            border: 1px solid var(--border);
        }
        
        .section-title {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
            color: var(--secondary);
            font-size: 1.4rem;
            font-weight: 600;
        }
        
        .input-group {
            display: flex;
            gap: 12px;
            margin-bottom: 15px;
        }
        
        input[type="text"],
        input[type="number"],
        select {
            flex: 1;
            padding: 14px 16px;
            border: 2px solid var(--border);
            border-radius: 8px;
            font-size: 1rem;
            transition: all 0.3s ease;
        }
        
        input:focus,
        select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(67, 97, 238, 0.1);
        }
        
        .btn {
            padding: 14px 24px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .btn-primary {
            background: var(--primary);
            color: white;
        }
        
        .btn-primary:hover {
            background: var(--secondary);
            transform: translateY(-2px);
        }
        
        .btn-success {
            background: var(--success);
            color: white;
        }
        
        .btn-success:hover {
            background: #3aa8d0;
            transform: translateY(-2px);
        }
        
        .btn-danger {
            background: var(--danger);
            color: white;
        }
        
        .btn-danger:hover {
            background: #e01a6f;
            transform: translateY(-2px);
        }
        
        .btn-warning {
            background: var(--warning);
            color: white;
        }
        
        .btn-warning:hover {
            background: #e6890e;
            transform: translateY(-2px);
        }
        
        .btn-sm {
            padding: 8px 16px;
            font-size: 0.9rem;
        }
        
        .list {
            list-style: none;
            margin-top: 15px;
        }
        
        .list-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px;
            background: white;
            margin-bottom: 10px;
            border-radius: 8px;
            border: 1px solid var(--border);
            transition: all 0.3s ease;
        }
        
        .list-item:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow);
        }
        
        .restaurant-item {
            background: white;
            border-radius: 8px;
            border: 1px solid var(--border);
            margin-bottom: 20px;
            overflow: hidden;
        }
        
        .restaurant-header {
            padding: 20px;
            background: var(--primary-light);
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .restaurant-title {
            font-size: 1.3rem;
            font-weight: 600;
        }
        
        .restaurant-paid-by {
            font-size: 0.9rem;
            opacity: 0.9;
        }
        
        .restaurant-dishes {
            padding: 20px;
        }
        
        .dish-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            background: var(--light);
            margin-bottom: 8px;
            border-radius: 6px;
            border-left: 4px solid var(--success);
        }
        
        .empty-state {
            text-align: center;
            padding: 30px;
            color: var(--gray);
            font-style: italic;
        }
        
        .compute-section {
            text-align: center;
            margin: 30px 0;
        }
        
        .compute-btn {
            padding: 16px 40px;
            font-size: 1.2rem;
            margin: 0 auto;
        }
        
        .results {
            display: none;
            margin-top: 40px;
        }
        
        .results-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 20px;
        }
        
        .result-section {
            padding: 25px;
            background: white;
            border-radius: var(--radius);
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
        }
        
        .results-title {
            color: var(--secondary);
            font-size: 1.4rem;
            font-weight: 600;
            margin-bottom: 20px;
            text-align: center;
        }
        
        .result-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px;
            margin-bottom: 12px;
            background: var(--light);
            border-radius: 8px;
            border-left: 4px solid var(--primary);
        }
        
        .result-total {
            font-weight: 700;
            font-size: 1.1rem;
            background: var(--primary);
            color: white;
            border-left: 4px solid var(--secondary);
        }
        
        .owed-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px;
            margin-bottom: 12px;
            background: var(--light);
            border-radius: 8px;
            border-left: 4px solid var(--warning);
        }
        
        .owed-positive {
            border-left: 4px solid var(--success);
        }
        
        .owed-negative {
            border-left: 4px solid var(--danger);
        }
        
        .quantity-control {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .quantity-btn {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: none;
            background: var(--primary);
            color: white;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }
        
        .quantity-btn:hover {
            background: var(--secondary);
            transform: scale(1.1);
        }
        
        .quantity-value {
            width: 50px;
            text-align: center;
            font-weight: 600;
            font-size: 1.1rem;
        }
        
        .person-quantity {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            background: white;
            border-radius: 8px;
            margin-bottom: 10px;
            border: 1px solid var(--border);
        }
        
        .person-cost {
            font-weight: 600;
            color: var(--primary);
            min-width: 80px;
            text-align: right;
        }
        
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
        }
        
        .modal {
            background: white;
            border-radius: var(--radius);
            width: 100%;
            max-width: 700px;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }
        
        .modal-header {
            padding: 20px 25px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .modal-title {
            font-size: 1.4rem;
            font-weight: 600;
            color: var(--secondary);
        }
        
        .modal-close {
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: var(--gray);
        }
        
        .modal-body {
            padding: 25px;
        }
        
        .toggle-container {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 20px 0;
            padding: 15px;
            background: white;
            border-radius: 8px;
            border: 1px solid var(--border);
        }
        
        .calculation-method {
            display: flex;
            gap: 15px;
            margin: 15px 0;
            padding: 15px;
            background: white;
            border-radius: 8px;
            border: 1px solid var(--border);
        }
        
        .method-option {
            flex: 1;
            text-align: center;
        }
        
        .method-btn {
            width: 100%;
            padding: 12px;
            border: 2px solid var(--border);
            border-radius: 8px;
            background: white;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
        }
        
        .method-btn.active {
            border-color: var(--primary);
            background: var(--primary);
            color: white;
        }
        
        .method-btn:hover:not(.active) {
            border-color: var(--primary-light);
            background: rgba(67, 97, 238, 0.1);
        }
        
        .method-info {
            font-size: 0.85rem;
            color: var(--gray);
            margin-top: 8px;
            line-height: 1.4;
        }
        
        .switch {
            position: relative;
            display: inline-block;
            width: 50px;
            height: 26px;
        }
        
        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }
        
        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: #ccc;
            transition: .4s;
            border-radius: 34px;
        }
        
        .slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 4px;
            bottom: 4px;
            background: white;
            transition: .4s;
            border-radius: 50%;
        }
        
        input:checked + .slider {
            background: var(--primary);
        }
        
        input:checked + .slider:before {
            transform: translateX(24px);
        }
        
        .modal-footer {
            padding: 20px 25px;
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: flex-end;
            gap: 12px;
        }
        
        .error {
            color: var(--danger);
            font-size: 0.9rem;
            margin-top: 5px;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        
        .price-info {
            font-size: 0.9rem;
            color: var(--gray);
            margin-top: 5px;
            line-height: 1.5;
        }
        
        .calculation-preview {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            margin-top: 15px;
            border-left: 4px solid var(--success);
        }
        
        .dish-input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }
        
        .add-dish-btn {
            margin-bottom: 15px;
        }
        
        @media (max-width: 768px) {
            .input-group {
                flex-direction: column;
            }
            
            .header h1 {
                font-size: 2rem;
            }
            
            .content {
                padding: 20px;
            }
            
            .calculation-method {
                flex-direction: column;
            }
            
            .results-grid {
                grid-template-columns: 1fr;
            }
            
            .dish-input-group {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Advanced Bill Splitter</h1>
            <p>Split bills by restaurant with multiple dishes</p>
        </div>
        
        <div class="content">
            <!-- Add People Section -->
            <div class="section">
                <div class="section-title">
                    <span>👥</span>
                    <h2>Add People</h2>
                </div>
                <div class="input-group">
                    <input type="text" id="personName" placeholder="Enter person's name">
                    <button id="addPersonBtn" class="btn btn-primary">
                        <span>+</span> Add Person
                    </button>
                </div>
                <div id="personError" class="error"></div>
                <ul id="personList" class="list">
                    <li class="empty-state">No people added yet</li>
                </ul>
            </div>
            
            <!-- Add Restaurants Section -->
            <div class="section">
                <div class="section-title">
                    <span>🏪</span>
                    <h2>Add Restaurants/Places</h2>
                </div>
                <div class="input-group">
                    <input type="text" id="restaurantName" placeholder="Restaurant or place name">
                    <select id="restaurantPaidBy">
                        <option value="">Who paid?</option>
                    </select>
                    <button id="addRestaurantBtn" class="btn btn-primary">
                        <span>+</span> Add Restaurant
                    </button>
                </div>
                <div id="restaurantError" class="error"></div>
                <div id="restaurantList">
                    <div class="empty-state">No restaurants added yet</div>
                </div>
            </div>
            
            <!-- Compute Button -->
            <div class="compute-section">
                <button id="computeBtn" class="btn btn-success compute-btn">
                    💰 Compute All Splits
                </button>
            </div>
            
            <!-- Results Section -->
            <div id="results" class="results">
                <div class="results-grid">
                    <div class="result-section">
                        <div class="results-title">Individual Totals</div>
                        <div id="resultList"></div>
                    </div>
                    <div class="result-section">
                        <div class="results-title">Who Owes Whom</div>
                        <div id="owedList"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Data storage
        let people = [];
        let restaurants = [];
        let currentModalOverlay = null;
        let currentRestaurantId = null;
        
        // DOM elements
        const personNameInput = document.getElementById('personName');
        const addPersonBtn = document.getElementById('addPersonBtn');
        const personList = document.getElementById('personList');
        const personError = document.getElementById('personError');
        
        const restaurantNameInput = document.getElementById('restaurantName');
        const restaurantPaidBySelect = document.getElementById('restaurantPaidBy');
        const addRestaurantBtn = document.getElementById('addRestaurantBtn');
        const restaurantList = document.getElementById('restaurantList');
        const restaurantError = document.getElementById('restaurantError');
        
        const computeBtn = document.getElementById('computeBtn');
        const results = document.getElementById('results');
        const resultList = document.getElementById('resultList');
        const owedList = document.getElementById('owedList');
        
        // Add person functionality
        addPersonBtn.addEventListener('click', addPerson);
        personNameInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') addPerson();
        });
        
        function addPerson() {
            const name = personNameInput.value.trim();
            
            if (!name) {
                showError(personError, "Please enter a name");
                return;
            }
            
            if (people.some(person => person.name === name)) {
                showError(personError, "This person is already added");
                return;
            }
            
            // Add person to the list
            const newPerson = {
                id: Date.now(),
                name: name
            };
            people.push(newPerson);
            
            // Update paid by dropdowns
            updatePaidBySelects();
            
            // Clear input and error
            personNameInput.value = '';
            personError.textContent = '';
            
            // Update UI
            renderPeople();
        }
        
        function updatePaidBySelects() {
            // Update restaurant paid by select
            restaurantPaidBySelect.innerHTML = '<option value="">Who paid?</option>';
            people.forEach(person => {
                const option = document.createElement('option');
                option.value = person.id;
                option.textContent = person.name;
                restaurantPaidBySelect.appendChild(option);
            });
        }
        
        function renderPeople() {
            if (people.length === 0) {
                personList.innerHTML = '<li class="empty-state">No people added yet</li>';
                return;
            }
            
            personList.innerHTML = '';
            people.forEach(person => {
                const li = document.createElement('li');
                li.className = 'list-item';
                li.innerHTML = `
                    <span>${person.name}</span>
                    <button class="btn btn-danger btn-sm" data-id="${person.id}">
                        <span>×</span> Remove
                    </button>
                `;
                personList.appendChild(li);
            });
            
            // Add event listeners to remove buttons
            document.querySelectorAll('.list-item button').forEach(button => {
                button.addEventListener('click', function() {
                    const id = parseInt(this.getAttribute('data-id'));
                    removePerson(id);
                });
            });
        }
        
        function removePerson(id) {
            people = people.filter(person => person.id !== id);
            updatePaidBySelects();
            renderPeople();
            renderRestaurants();
        }
        
        // Add restaurant functionality
        addRestaurantBtn.addEventListener('click', addRestaurant);
        
        function addRestaurant() {
            const name = restaurantNameInput.value.trim();
            const paidById = parseInt(restaurantPaidBySelect.value);
            
            if (!name) {
                showError(restaurantError, "Please enter a restaurant name");
                return;
            }
            
            if (!paidById) {
                showError(restaurantError, "Please select who paid for this restaurant");
                return;
            }
            
            if (people.length === 0) {
                showError(restaurantError, "Please add people first");
                return;
            }
            
            // Add restaurant to the list
            const newRestaurant = {
                id: Date.now(),
                name: name,
                paidBy: paidById,
                dishes: []
            };
            restaurants.push(newRestaurant);
            
            // Clear inputs and error
            restaurantNameInput.value = '';
            restaurantPaidBySelect.value = '';
            restaurantError.textContent = '';
            
            // Update UI
            renderRestaurants();
        }
        
        function renderRestaurants() {
            if (restaurants.length === 0) {
                restaurantList.innerHTML = '<div class="empty-state">No restaurants added yet</div>';
                return;
            }
            
            restaurantList.innerHTML = '';
            restaurants.forEach(restaurant => {
                const restaurantElement = document.createElement('div');
                restaurantElement.className = 'restaurant-item';
                
                const paidByName = people.find(p => p.id === restaurant.paidBy)?.name || 'Unknown';
                const totalAmount = restaurant.dishes.reduce((sum, dish) => sum + dish.price, 0);
                
                restaurantElement.innerHTML = `
                    <div class="restaurant-header">
                        <div class="restaurant-title">${restaurant.name} - Total: $${totalAmount.toFixed(2)}</div>
                        <div class="restaurant-paid-by">Paid by: ${paidByName}</div>
                    </div>
                    <div class="restaurant-dishes">
                        <div class="dish-input-group">
                            <input type="text" id="dish-name-${restaurant.id}" placeholder="Dish name" class="dish-name-input">
                            <input type="number" id="dish-price-${restaurant.id}" placeholder="Price" min="0" step="0.01" class="dish-price-input">
                            <button class="btn btn-primary btn-sm add-dish-btn" data-restaurant="${restaurant.id}">
                                <span>+</span> Add Dish
                            </button>
                        </div>
                        <div id="dishes-list-${restaurant.id}">
                            ${restaurant.dishes.length === 0 ? 
                                '<div class="empty-state">No dishes added yet</div>' : 
                                restaurant.dishes.map(dish => `
                                    <div class="dish-item">
                                        <div>
                                            <strong>${dish.name}</strong> - $${dish.price.toFixed(2)}
                                            ${dish.useQuantities ? 
                                                `<div style="font-size: 0.8rem; color: #666;">
                                                    (${dish.calculationMethod === 'divide' ? 'Divided' : 'Multiplied'})
                                                </div>` : ''}
                                        </div>
                                        <div>
                                            <button class="btn btn-warning btn-sm edit-dish-btn" data-restaurant="${restaurant.id}" data-dish="${dish.id}">
                                                ✏️ Edit
                                            </button>
                                            <button class="btn btn-danger btn-sm remove-dish-btn" data-restaurant="${restaurant.id}" data-dish="${dish.id}">
                                                × Remove
                                            </button>
                                        </div>
                                    </div>
                                `).join('')
                            }
                        </div>
                    </div>
                `;
                restaurantList.appendChild(restaurantElement);
            });
            
            // Add event listeners for dish buttons
            document.querySelectorAll('.add-dish-btn').forEach(button => {
                button.addEventListener('click', function() {
                    const restaurantId = parseInt(this.getAttribute('data-restaurant'));
                    const dishNameInput = document.getElementById(`dish-name-${restaurantId}`);
                    const dishPriceInput = document.getElementById(`dish-price-${restaurantId}`);
                    
                    const name = dishNameInput.value.trim();
                    const price = parseFloat(dishPriceInput.value);
                    
                    if (!name) {
                        alert('Please enter a dish name');
                        return;
                    }
                    
                    if (isNaN(price) || price <= 0) {
                        alert('Please enter a valid price');
                        return;
                    }
                    
                    // Create modal for dish assignment
                    createDishAssignmentModal(restaurantId, name, price);
                    
                    // Clear inputs
                    dishNameInput.value = '';
                    dishPriceInput.value = '';
                });
            });
            
            document.querySelectorAll('.edit-dish-btn').forEach(button => {
                button.addEventListener('click', function() {
                    const restaurantId = parseInt(this.getAttribute('data-restaurant'));
                    const dishId = parseInt(this.getAttribute('data-dish'));
                    editDish(restaurantId, dishId);
                });
            });
            
            document.querySelectorAll('.remove-dish-btn').forEach(button => {
                button.addEventListener('click', function() {
                    const restaurantId = parseInt(this.getAttribute('data-restaurant'));
                    const dishId = parseInt(this.getAttribute('data-dish'));
                    removeDish(restaurantId, dishId);
                });
            });
        }
        
        function createDishAssignmentModal(restaurantId, name, price) {
            currentRestaurantId = restaurantId;
            
            // Remove any existing modal first
            if (currentModalOverlay) {
                document.body.removeChild(currentModalOverlay);
            }
            
            // Create modal overlay
            currentModalOverlay = document.createElement('div');
            currentModalOverlay.className = 'modal-overlay';
            
            // Create modal content
            const modal = document.createElement('div');
            modal.className = 'modal';
            
            modal.innerHTML = `
                <div class="modal-header">
                    <div class="modal-title">Assign Dish: "${name}"</div>
                    <button class="modal-close">&times;</button>
                </div>
                <div class="modal-body">
                    <p><strong>Dish Price: $${price.toFixed(2)}</strong></p>
                    
                    <div class="toggle-container">
                        <label class="switch">
                            <input type="checkbox" id="enableQuantities">
                            <span class="slider"></span>
                        </label>
                        <span>Enable individual quantities</span>
                    </div>
                    
                    <div id="calculationMethod" style="display: none;">
                        <div class="calculation-method">
                            <div class="method-option">
                                <button class="method-btn active" data-method="divide">
                                    Divide Total
                                </button>
                                <div class="method-info">
                                    Total amount divided proportionally by quantities
                                </div>
                            </div>
                            <div class="method-option">
                                <button class="method-btn" data-method="multiply">
                                    Multiply by Price
                                </button>
                                <div class="method-info">
                                    Each quantity multiplied by price per unit
                                </div>
                            </div>
                        </div>
                        <div class="calculation-preview" id="calculationPreview">
                            <strong>Divide Method:</strong> Total amount ($${price.toFixed(2)}) ÷ Total quantities × Individual quantity
                        </div>
                    </div>
                    
                    <div id="assignmentSection">
                        <p><strong>Select who shared this dish:</strong></p>
                        <div id="assignmentCheckboxes"></div>
                    </div>
                    
                    <div id="quantitySection" style="display: none; margin-top: 20px;">
                        <p><strong>Specify quantities for each person:</strong></p>
                        <div id="quantityInputs"></div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button id="cancelAssignment" class="btn btn-danger">Cancel</button>
                    <button id="saveAssignment" class="btn btn-success">Save Dish</button>
                </div>
            `;
            
            currentModalOverlay.appendChild(modal);
            document.body.appendChild(currentModalOverlay);
            
            // Add checkboxes for each person
            const checkboxesContainer = document.getElementById('assignmentCheckboxes');
            const quantityInputsContainer = document.getElementById('quantityInputs');
            const calculationMethodSection = document.getElementById('calculationMethod');
            const calculationPreview = document.getElementById('calculationPreview');
            
            people.forEach(person => {
                // Add checkbox
                const checkboxItem = document.createElement('div');
                checkboxItem.className = 'list-item';
                checkboxItem.style.marginBottom = '8px';
                checkboxItem.innerHTML = `
                    <div style="display: flex; align-items: center; gap: 10px;">
                        <input type="checkbox" id="person-${person.id}" value="${person.id}" checked>
                        <label for="person-${person.id}">${person.name}</label>
                    </div>
                `;
                checkboxesContainer.appendChild(checkboxItem);
                
                // Add quantity input (initially hidden)
                const quantityItem = document.createElement('div');
                quantityItem.className = 'person-quantity';
                quantityItem.id = `quantity-${person.id}`;
                quantityItem.style.display = 'none';
                quantityItem.innerHTML = `
                    <span>${person.name}</span>
                    <div style="display: flex; align-items: center; gap: 15px;">
                        <div class="quantity-control">
                            <button class="quantity-btn" data-action="decrease" data-person="${person.id}">-</button>
                            <span class="quantity-value" id="qty-value-${person.id}">1</span>
                            <button class="quantity-btn" data-action="increase" data-person="${person.id}">+</button>
                        </div>
                        <span class="person-cost" id="cost-${person.id}">$0.00</span>
                    </div>
                `;
                quantityInputsContainer.appendChild(quantityItem);
            });
            
            let calculationMethod = 'divide';
            
            // Function to update cost display
            function updateCostDisplay() {
                people.forEach(person => {
                    const quantity = parseInt(document.getElementById(`qty-value-${person.id}`).textContent) || 0;
                    let cost = 0;
                    
                    if (calculationMethod === 'divide') {
                        // Calculate total quantity
                        let totalQuantity = 0;
                        document.querySelectorAll('#assignmentCheckboxes input:checked').forEach(checkbox => {
                            const personId = checkbox.value;
                            const personQty = parseInt(document.getElementById(`qty-value-${personId}`).textContent) || 0;
                            totalQuantity += personQty;
                        });
                        
                        if (totalQuantity > 0) {
                            const costPerUnit = price / totalQuantity;
                            cost = costPerUnit * quantity;
                        }
                    } else {
                        // Multiply method
                        cost = price * quantity;
                    }
                    
                    document.getElementById(`cost-${person.id}`).textContent = `$${cost.toFixed(2)}`;
                });
            }
            
            // Toggle quantity inputs based on checkbox
            const enableQuantitiesCheckbox = document.getElementById('enableQuantities');
            const quantitySection = document.getElementById('quantitySection');
            
            enableQuantitiesCheckbox.addEventListener('change', function() {
                if (this.checked) {
                    quantitySection.style.display = 'block';
                    calculationMethodSection.style.display = 'block';
                    
                    // Show quantity inputs for selected people
                    document.querySelectorAll('#assignmentCheckboxes input:checked').forEach(checkbox => {
                        const personId = checkbox.value;
                        document.getElementById(`quantity-${personId}`).style.display = 'flex';
                    });
                    
                    // Update cost display
                    updateCostDisplay();
                } else {
                    quantitySection.style.display = 'none';
                    calculationMethodSection.style.display = 'none';
                }
            });
            
            // Update quantity inputs when checkboxes change
            document.querySelectorAll('#assignmentCheckboxes input').forEach(checkbox => {
                checkbox.addEventListener('change', function() {
                    if (enableQuantitiesCheckbox.checked) {
                        const personId = this.value;
                        if (this.checked) {
                            document.getElementById(`quantity-${personId}`).style.display = 'flex';
                        } else {
                            document.getElementById(`quantity-${personId}`).style.display = 'none';
                        }
                        updateCostDisplay();
                    }
                });
            });
            
            // Calculation method selection
            document.querySelectorAll('.method-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    // Remove active class from all buttons
                    document.querySelectorAll('.method-btn').forEach(b => b.classList.remove('active'));
                    // Add active class to clicked button
                    this.classList.add('active');
                    
                    calculationMethod = this.getAttribute('data-method');
                    
                    // Update preview text
                    if (calculationMethod === 'divide') {
                        calculationPreview.innerHTML = `
                            <strong>Divide Method:</strong> Total amount ($${price.toFixed(2)}) ÷ Total quantities × Individual quantity
                        `;
                    } else {
                        calculationPreview.innerHTML = `
                            <strong>Multiply Method:</strong> Individual quantity × Price per unit ($${price.toFixed(2)})
                        `;
                    }
                    
                    // Update cost display
                    updateCostDisplay();
                });
            });
            
            // Add event listeners for quantity buttons
            function handleQuantityButtonClick(e) {
                if (e.target.classList.contains('quantity-btn')) {
                    const action = e.target.getAttribute('data-action');
                    const personId = e.target.getAttribute('data-person');
                    const quantityElement = document.getElementById(`qty-value-${personId}`);
                    let value = parseInt(quantityElement.textContent);
                    
                    if (action === 'increase') {
                        value++;
                    } else if (action === 'decrease' && value > 1) {
                        value--;
                    }
                    
                    quantityElement.textContent = value;
                    updateCostDisplay();
                }
            }
            
            // Add event listener directly to the modal
            modal.addEventListener('click', handleQuantityButtonClick);
            
            // Add event listeners for modal buttons
            document.getElementById('cancelAssignment').addEventListener('click', function() {
                document.body.removeChild(currentModalOverlay);
                currentModalOverlay = null;
                currentRestaurantId = null;
            });
            
            document.querySelector('.modal-close').addEventListener('click', function() {
                document.body.removeChild(currentModalOverlay);
                currentModalOverlay = null;
                currentRestaurantId = null;
            });
            
            document.getElementById('saveAssignment').addEventListener('click', function() {
                // Get selected people
                const selectedPeople = [];
                const quantities = {};
                
                document.querySelectorAll('#assignmentCheckboxes input:checked').forEach(checkbox => {
                    const personId = parseInt(checkbox.value);
                    selectedPeople.push(personId);
                    
                    // Get quantity if enabled
                    if (enableQuantitiesCheckbox.checked) {
                        const quantityValue = document.getElementById(`qty-value-${personId}`).textContent;
                        quantities[personId] = parseInt(quantityValue) || 1;
                    } else {
                        quantities[personId] = 1;
                    }
                });
                
                if (selectedPeople.length === 0) {
                    alert('Please select at least one person');
                    return;
                }
                
                // Find the restaurant and add dish
                const restaurant = restaurants.find(r => r.id === currentRestaurantId);
                if (restaurant) {
                    restaurant.dishes.push({
                        id: Date.now(),
                        name: name,
                        price: price,
                        people: selectedPeople,
                        quantities: quantities,
                        useQuantities: enableQuantitiesCheckbox.checked,
                        calculationMethod: calculationMethod
                    });
                }
                
                // Update UI
                renderRestaurants();
                
                // Close modal
                document.body.removeChild(currentModalOverlay);
                currentModalOverlay = null;
                currentRestaurantId = null;
            });
            
            // Initial cost display update
            updateCostDisplay();
        }
        
        function editDish(restaurantId, dishId) {
            const restaurant = restaurants.find(r => r.id === restaurantId);
            if (!restaurant) return;
            
            const dish = restaurant.dishes.find(d => d.id === dishId);
            if (!dish) return;
            
            // Remove the dish first
            removeDish(restaurantId, dishId, false);
            
            // Create modal with existing dish data
            createDishAssignmentModal(restaurantId, dish.name, dish.price);
            
            // Pre-fill the modal with existing data
            setTimeout(() => {
                // Set quantities enabled if it was enabled before
                if (dish.useQuantities) {
                    document.getElementById('enableQuantities').checked = true;
                    document.getElementById('enableQuantities').dispatchEvent(new Event('change'));
                    
                    // Set calculation method
                    document.querySelectorAll('.method-btn').forEach(btn => {
                        if (btn.getAttribute('data-method') === dish.calculationMethod) {
                            btn.click();
                        }
                    });
                    
                    // Set quantities for each person
                    dish.people.forEach(personId => {
                        const quantity = dish.quantities[personId];
                        document.getElementById(`qty-value-${personId}`).textContent = quantity;
                    });
                    
                    // Update cost display
                    if (typeof updateCostDisplay === 'function') {
                        updateCostDisplay();
                    }
                }
                
                // Set checkboxes
                document.querySelectorAll('#assignmentCheckboxes input').forEach(checkbox => {
                    checkbox.checked = dish.people.includes(parseInt(checkbox.value));
                    checkbox.dispatchEvent(new Event('change'));
                });
            }, 100);
        }
        
        function removeDish(restaurantId, dishId, updateUI = true) {
            const restaurant = restaurants.find(r => r.id === restaurantId);
            if (restaurant) {
                restaurant.dishes = restaurant.dishes.filter(d => d.id !== dishId);
                if (updateUI) {
                    renderRestaurants();
                }
            }
        }
        
        function removeRestaurant(id) {
            restaurants = restaurants.filter(restaurant => restaurant.id !== id);
            renderRestaurants();
        }
        
        // Compute functionality
        computeBtn.addEventListener('click', computeSplit);
        
        function computeSplit() {
            if (people.length === 0) {
                alert('Please add at least one person');
                return;
            }
            
            if (restaurants.length === 0) {
                alert('Please add at least one restaurant');
                return;
            }
            
            // Calculate amounts for each person
            const amounts = {};
            const payments = {};
            
            people.forEach(person => {
                amounts[person.id] = 0;
                payments[person.id] = 0;
            });
            
            // For each restaurant and each dish, split the cost
            restaurants.forEach(restaurant => {
                // Track who paid for the restaurant
                payments[restaurant.paidBy] += restaurant.dishes.reduce((sum, dish) => sum + dish.price, 0);
                
                // Process each dish in the restaurant
                restaurant.dishes.forEach(dish => {
                    if (dish.useQuantities) {
                        if (dish.calculationMethod === 'divide') {
                            // Calculate total quantity for this dish
                            let totalQuantity = 0;
                            dish.people.forEach(personId => {
                                totalQuantity += dish.quantities[personId];
                            });
                            
                            // Calculate cost per unit of quantity
                            const costPerUnit = dish.price / totalQuantity;
                            
                            // Assign cost to each person based on their quantity
                            dish.people.forEach(personId => {
                                const personQuantity = dish.quantities[personId];
                                amounts[personId] += costPerUnit * personQuantity;
                            });
                        } else {
                            // Multiply method: Each quantity multiplied by the price
                            dish.people.forEach(personId => {
                                const personQuantity = dish.quantities[personId];
                                amounts[personId] += dish.price * personQuantity;
                            });
                        }
                    } else {
                        // Split evenly among selected people
                        const costPerPerson = dish.price / dish.people.length;
                        dish.people.forEach(personId => {
                            amounts[personId] += costPerPerson;
                        });
                    }
                });
            });
            
            // Calculate net amounts (payments - amounts owed)
            const netAmounts = {};
            people.forEach(person => {
                netAmounts[person.id] = payments[person.id] - amounts[person.id];
            });
            
            // Display results
            displayResults(amounts, payments, netAmounts);
        }
        
        function displayResults(amounts, payments, netAmounts) {
            // Display individual totals
            resultList.innerHTML = '';
            
            let totalAmount = 0;
            let totalPayments = 0;
            
            people.forEach(person => {
                const amount = amounts[person.id];
                const payment = payments[person.id];
                totalAmount += amount;
                totalPayments += payment;
                
                const resultItem = document.createElement('div');
                resultItem.className = `result-item ${netAmounts[person.id] >= 0 ? 'owed-positive' : 'owed-negative'}`;
                resultItem.innerHTML = `
                    <div>
                        <strong>${person.name}</strong>
                        <div style="font-size: 0.9rem; color: #666;">
                            Paid: $${payment.toFixed(2)} | Owes: $${amount.toFixed(2)}
                        </div>
                    </div>
                    <div style="text-align: right;">
                        <div style="font-weight: 600; color: ${netAmounts[person.id] >= 0 ? 'var(--success)' : 'var(--danger)'}">
                            ${netAmounts[person.id] >= 0 ? 'Gets back' : 'Owes'} $${Math.abs(netAmounts[person.id]).toFixed(2)}
                        </div>
                    </div>
                `;
                resultList.appendChild(resultItem);
            });
            
            // Add total
            const totalItem = document.createElement('div');
            totalItem.className = 'result-item result-total';
            totalItem.innerHTML = `
                <span>Total</span>
                <span>Paid: $${totalPayments.toFixed(2)} | Owed: $${totalAmount.toFixed(2)}</span>
            `;
            resultList.appendChild(totalItem);
            
            // Display who owes whom
            displayOwedAmounts(netAmounts);
            
            // Show results
            results.style.display = 'block';
            
            // Scroll to results
            results.scrollIntoView({ behavior: 'smooth' });
        }
        
        function displayOwedAmounts(netAmounts) {
            owedList.innerHTML = '';
            
            // Separate people who owe money and people who are owed money
            const debtors = [];
            const creditors = [];
            
            people.forEach(person => {
                const net = netAmounts[person.id];
                if (net < 0) {
                    debtors.push({ person, amount: -net }); // Convert to positive amount owed
                } else if (net > 0) {
                    creditors.push({ person, amount: net });
                }
            });
            
            // Sort by amount (largest first)
            debtors.sort((a, b) => b.amount - a.amount);
            creditors.sort((a, b) => b.amount - a.amount);
            
            // Calculate settlements
            let i = 0, j = 0;
            
            while (i < debtors.length && j < creditors.length) {
                const debtor = debtors[i];
                const creditor = creditors[j];
                
                const settleAmount = Math.min(debtor.amount, creditor.amount);
                
                if (settleAmount > 0.01) { // Only show settlements above 1 cent
                    const owedItem = document.createElement('div');
                    owedItem.className = 'owed-item';
                    owedItem.innerHTML = `
                        <div>
                            <strong>${debtor.person.name}</strong> owes <strong>${creditor.person.name}</strong>
                        </div>
                        <span style="font-weight: 600; color: var(--warning);">$${settleAmount.toFixed(2)}</span>
                    `;
                    owedList.appendChild(owedItem);
                }
                
                // Update amounts
                debtor.amount -= settleAmount;
                creditor.amount -= settleAmount;
                
                // Move to next debtor/creditor if current one is settled
                if (debtor.amount < 0.01) i++;
                if (creditor.amount < 0.01) j++;
            }
            
            if (owedList.children.length === 0) {
                owedList.innerHTML = '<div class="empty-state">All settled up! No money needs to change hands.</div>';
            }
        }
        
        function showError(element, message) {
            element.textContent = message;
        }
    </script>
</body>
</html>
